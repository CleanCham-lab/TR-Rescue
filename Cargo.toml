[package]
name = "tr-rescue"
version = "1.0.0"
description = "Dropout-aware tandem repeat expansion evidence for PacBio HiFi WGS"
license = "MIT"
authors = ["Seung Won Chae"]
edition = "2024"

[dependencies]
anyhow = "1.0.104"
calamine = "0.38.0"
clap = { version = "4.6.7", features = ["derive"] }
crossbeam-channel = "0.5.17"
encoding_rs = "0.8.44"
noodles = { version = "0.119.0", features = ["bam", "bgzf", "sam", "core", "csi", "fasta"] }
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
